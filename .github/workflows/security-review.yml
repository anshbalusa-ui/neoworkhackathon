name: Verify Neo action security submission
on:
  push:
    branches: [main]
    paths:
      - "neo-action-*.md"
      - "reference/**"
      - "tests/**"
      - "scripts/**"
      - "site/**"
      - "README.md"
      - "ENGINEERING_HANDOFF.md"
      - "DEMO_GUIDE.md"
      - "AGENTS.md"
      - "CODEX_MASTER_PROMPT.md"
      - ".codex/**"
      - "neo-action-security-architecture.zip"
      - ".github/workflows/security-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify simulator-backed site evidence
        run: python3 -m reference.scenario --check-site
      - name: Counterfactual adversarial assurance
        run: |
          python3 - <<'PY'
          from reference.assurance import run_sweep
          evidence = run_sweep(seed=3470, rounds=24)
          print(f"Proposals denied: {evidence['blocked']}/{evidence['attempted']}")
          print(f"Safe task recoveries: {evidence['safe_recoveries']}/{evidence['attempted']}")
          print(f"Unexpected network effects blocked: {evidence['effect_blocked']}/{evidence['effect_attempted']}")
          assert evidence['status'] == 'PASS', evidence
          PY
      - name: Validate site HTML and JavaScript
        run: python3 scripts/validate_site.py
      - name: Real Chromium interactive demo smoke
        run: node scripts/browser_smoke.mjs
      - name: Upload reviewer browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neo-browser-smoke-screenshots
          path: smoke-artifacts/*.png
          if-no-files-found: ignore
      - name: Validate committed archive, then rebuild
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          names = ("neo-action-security-architecture.md", "neo-action-threat-model.md", "neo-action-confirmation-policy.md")
          with ZipFile("neo-action-security-architecture.zip") as archive:
              assert sorted(archive.namelist()) == sorted(names)
              assert archive.testzip() is None
              for name in names:
                  assert archive.read(name) == Path(name).read_bytes(), name
          print("PASS: committed ZIP matches all three Markdown sources")
          PY
          python3 scripts/build_submission.py
          unzip -t neo-action-security-architecture.zip
      - uses: actions/upload-artifact@v4
        with:
          name: neo-action-security-architecture
          path: neo-action-security-architecture.zip
